[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ckpt-chaos"
version = "0.1.2"
description = "Crash-consistency testing for ML training checkpoints: kill a save at every file boundary, resume, classify the outcome."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rkb32" }]
keywords = ["checkpoint", "pytorch", "fault-tolerance", "chaos-engineering", "reproducibility", "testing", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # the `run` command needs only the standard library; your own script brings its framework

[project.optional-dependencies]
bench = ["torch", "transformers", "accelerate", "lightning"]  # only for the built-in `bench` targets

[project.urls]
Homepage = "https://github.com/rkb32/ckpt-chaos"
Issues = "https://github.com/rkb32/ckpt-chaos/issues"

[project.scripts]
ckpt-chaos = "ckpt_chaos.cli:main"

[tool.setuptools.packages.find]
include = ["ckpt_chaos*"]

[tool.setuptools.package-data]
ckpt_chaos = ["_boot/*.py"]

name: publish
# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored anywhere.
# One-time setup on pypi.org: Account -> Publishing -> add a pending publisher for project "ckpt-chaos",
# owner "rkb32", repository "ckpt-chaos", workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

name: tests
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install h5py tensorstore accelerate
      - run: python -m unittest discover tests -v

  # One stable check name for branch protection, for the test matrix. Require "tests-green", not the matrix job names.
  tests-green:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
